<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page">
    <header class="appbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="16" rx="3" />
            <line x1="8" y1="9" x2="8.01" y2="9" />
            <line x1="8" y1="15" x2="16" y2="15" />
            <line x1="12" y1="12" x2="16" y2="12" />
          </svg>
        </span>
        <span class="brand-name">Calculator</span>
      </div>
      <div class="appbar-actions">
        <button class="icon-btn" id="historyToggle" type="button" aria-label="Show calculation history">◷</button>
        <button class="icon-btn" id="themeToggle" type="button" aria-label="Toggle light and dark mode">☀</button>
      </div>
    </header>

    <section class="calculator" aria-label="Calculator">
      <div class="display" id="display">
        <span class="mem-indicator" id="memIndicator" hidden>M</span>
        <div class="expression" id="expression" aria-live="polite">0</div>
        <div class="live-result" id="liveResult" aria-live="polite"></div>
      </div>

      <div class="util-row">
        <button class="util-key" type="button" data-bracket="(" aria-label="Open bracket">(</button>
        <button class="util-key" type="button" data-bracket=")" aria-label="Close bracket">)</button>
        <button class="util-key" type="button" data-action="mem-add">M+</button>
        <button class="util-key" type="button" data-action="mem-recall">MR</button>
        <button class="util-key" type="button" data-action="mem-clear">MC</button>
        <button class="util-key" type="button" data-action="copy" aria-label="Copy result">⧉</button>
      </div>

      <div class="keys">
        <button class="key util" type="button" data-action="clear">C</button>
        <button class="key util" type="button" data-action="backspace">⌫</button>
        <button class="key util" type="button" data-action="percent">%</button>
        <button class="key op" type="button" data-op="÷">÷</button>

        <button class="key num" type="button" data-num="7">7</button>
        <button class="key num" type="button" data-num="8">8</button>
        <button class="key num" type="button" data-num="9">9</button>
        <button class="key op" type="button" data-op="×">×</button>

        <button class="key num" type="button" data-num="4">4</button>
        <button class="key num" type="button" data-num="5">5</button>
        <button class="key num" type="button" data-num="6">6</button>
        <button class="key op" type="button" data-op="−">−</button>

        <button class="key num" type="button" data-num="1">1</button>
        <button class="key num" type="button" data-num="2">2</button>
        <button class="key num" type="button" data-num="3">3</button>
        <button class="key op" type="button" data-op="+">+</button>

        <button class="key num" type="button" data-action="negate">±</button>
        <button class="key num" type="button" data-num="0">0</button>
        <button class="key num" type="button" data-num=".">.</button>
        <button class="key equals" type="button" data-action="equals">=</button>
      </div>

      <div class="history" id="historyPanel" hidden>
        <div class="history-head">
          <span>History</span>
          <button class="history-clear" id="historyClear" type="button">Clear</button>
        </div>
        <ul class="history-list" id="historyList"></ul>
        <p class="history-empty" id="historyEmpty">No calculations yet.</p>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
